[tool.poetry]
name = "pythonproject2"
version = "0.1.0"
description = ""
authors = ["Andrei Tiurin"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
pandas = "^3.0.0"
openpyxl = "^3.1.5"

[dependency-groups]
dev = [
    "requests (>=2.32.5,<3.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs=true
warn_return_any=true
exclude = ".venv"
